openapi: 3.0.0
info:
  title: Sport Booking API
  version: 1.0.0
  description: API для системы записи в спортивные залы

security:
  - bearerAuth: []

servers:
  - url: http://api.example.com/v1
    description: Production server

paths:
  /user/{user-id}/gainedHours:
    get:
      summary: Получить количество набранных часов студента
      operationId: getGainedHours
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  gainedHours:
                    type: integer
                    description: Количество набранных часов
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Добавить часы пользователю (админ)
      operationId: addGainedHours
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hours
              properties:
                hours:
                  type: number
                  format: integer
                  description: Количество часов для добавления
      responses:
        '204':
          description: Часы успешно добавлены
        '400':
          description: Некорректное количество часов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{user-id}/isBanned:
    post:
      summary: Заблокировать пользователя (админ)
      operationId: banUser
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - banDuration
              properties:
                banDuration:
                  type: integer
                  format: int64
                  description: Длительность блокировки в секундах
                reason:
                  type: string
                  description: Причина блокировки
      responses:
        '204':
          description: Пользователь успешно заблокирован
        '400':
          description: Некорректная длительность блокировки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{user-id}/unbanTime:
    get:
      summary: Получить время разблокировки пользователя
      operationId: getUnbanTime
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  unbanTime:
                    type: integer
                    format: int64
                    description: Unix timestamp разблокировки (0 если не заблокирован)
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{user-id}/stats:
    get:
      summary: Получить статистику по залам
      operationId: getUserStats
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  gyms:
                    type: object
                    additionalProperties:
                      type: string
                      format: date-time
                      description: Время в часах
                    description: Статистика по залам
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sections/gymList:
    get:
      summary: Получить список доступных залов
      operationId: getGymList
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections:
                    type: array
                    items:
                      type: string
                    description: Названия залов
                  ids:
                    type: array
                    items:
                      type: integer


  /slots/{slot-id}:
    get:
      summary: Получить информацию о слоте
      operationId: getSlotInfo
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  slotId:
                    $ref: '#/components/schemas/SlotId'
                  participants:
                    type: integer
                    description: Количество записавшихся
                  capacity:
                    type: integer
                  startTime:
                    type: string  
                    format: date-time
                    description: Время начала
                  endTime:
                    type: string
                    format: date-time
                    description: Время окончания
                  gymId:
                    type: integer
                  gymName:
                    type: string
        '404':
          description: Слот не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Закрыть слот для записи
      operationId: closeSlot
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
      responses:
        '204':
          description: Слот успешно закрыт
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Изменить информацию о слоте (админ)
      operationId: updateSlotInfo
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                  description: Время начала
                endTime:
                  type: string
                  format: date-time
                  description: Время окончания
                capacity:
                  type: integer
      responses:
        '204':
          description: Информация успешно обновлена
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /slots/{slot-id}/entries:
    post:
      summary: Записаться в слот
      operationId: registerForSlot
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
          description: ID слота
      responses:
        '204':
          description: Успешная запись
        '404':
          description: Слот не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Удалить запись пользователя
      operationId: deleteUserEntry
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
          description: ID слота
      responses:
        '204':
          description: Запись успешно удалена
        '403':
          description: Неверный токен или недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /queue/{slot-id}/join:
    post:
      summary: Встать в очередь на слот
      operationId: joinQueue
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
      responses:
        '204':
          description: Успешно добавлен в очередь

  /queue/{slot-id}/leave:
    post:
      summary: Выйти из очереди на слот
      operationId: leaveQueue
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
      responses:
        '204':
          description: Успешно вышел из очереди

  /auth/createAccount:
    post:
      operationId: createAccount
      security: []
      requestBody:
        description: Данные для создания аккаунта
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Аккаунт успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    $ref: '#/components/schemas/UserId'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string

  /auth/login:
    post:
      summary: Login to account
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    $ref: '#/components/schemas/UserId'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '403':
          description: Неправильный пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      summary: Update tokens
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Токены успешно обновлены
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '403':
          description: Неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/account:
    delete:
      summary: Удалить аккаунт
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        '204':
          description: Аккаунт успешно удален
        '403':
          description: Неверный пароль или токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserId:
      type: string
      format: uuid
      description: "Уникальный идентификатор пользователя в формате UUID"
    SlotId:
      type: string
      format: uuid
      description: "Уникальный идентификатор слота"
    Error:
      type: object
      properties:
        error:
          type: string
          description: Сообщение об ошибке
        code:
          type: integer
          description: Код ошибки
      required:
        - error
        - code