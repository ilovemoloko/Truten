openapi: 3.0.0
info:
  title: Sport Booking API
  version: 1.0.0
  description: API для системы записи в спортивные залы

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Авторизация и управление аккаунтом
  - name: User
    description: Управление данными пользователя
  - name: Slots
    description: Работа со слотами и записью
  - name: Sections
    description: Управление залами
  - name: Queue
    description: Управление очередью

servers:
  - url: http://api.example.com/v1
    description: Production server

paths:
  /user/{user-id}/gainedHours:
    get:
      tags: [User]
      summary: Получить количество набранных часов студента
      operationId: getGainedHours
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  gainedHours:
                    type: integer
                    description: Количество набранных часов
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [User]
      summary: Добавить часы пользователю (админ)
      operationId: addGainedHours
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hours
              properties:
                hours:
                  type: integer
                  description: Количество часов для добавления
      responses:
        '204':
          description: Часы успешно добавлены
        '400':
          description: Некорректное количество часов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{user-id}/enrollments:
    get:
      tags: [User]
      summary: Получить все записи пользователя
      operationId: getUserEnrollments
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollments:
                    type: array
                    items:
                      $ref: '#/components/schemas/SlotId'
                    description: Список ID слотов, на которые записан пользователь
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{user-id}/isBanned:
    post:
      tags: [User]
      summary: Заблокировать пользователя (админ)
      operationId: banUser
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - banDuration
              properties:
                banDuration:
                  type: integer
                  format: int64
                  description: Длительность блокировки в секундах
                reason:
                  type: string
                  description: Причина блокировки
      responses:
        '204':
          description: Пользователь успешно заблокирован
        '400':
          description: Некорректная длительность блокировки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{user-id}/unbanTime:
    get:
      tags: [User]
      summary: Получить время разблокировки пользователя
      operationId: getUnbanTime
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  unbanTime:
                    type: integer
                    format: int64
                    description: Unix timestamp разблокировки (0 если не заблокирован)
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{user-id}/stats:
    get:
      tags: [User]
      summary: Получить статистику по залам
      operationId: getUserStats
      parameters:
        - name: user-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  gyms:
                    type: object
                    additionalProperties:
                      type: integer
                      description: Количество часов, проведенных в зале
                    description: Статистика по залам
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sections/gymList:
    get:
      tags: [Sections]
      summary: Получить список доступных залов
      operationId: getGymList
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                          description: Название зала

    post:
      tags: [Sections]
      summary: Добавить новый зал (админ)
      operationId: createGym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gymName
                - creatorId
              properties:
                gymName:
                  type: string
                  description: Название нового зала
                creatorId:
                  $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Зал успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  gymId:
                    type: string
                    format: uuid
                    description: ID созданного зала
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sections/{gym-id}/slots:
    get:
      tags: [Sections]
      summary: Получить список слотов для зала
      operationId: getGymSlots
      parameters:
        - name: gym-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID зала
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        slotId:
                          $ref: '#/components/schemas/SlotId'
                        startTime:
                          type: string
                          format: date-time
                          description: Время начала слота
                        endTime:
                          type: string
                          format: date-time
                          description: Время окончания слота
                        capacity:
                          type: integer
                          description: Вместимость слота
                        participantsCount:
                          type: integer
                          description: Количество записавшихся
                        participants:
                          type: array
                          items:
                            $ref: '#/components/schemas/Participant'
                          description: Список пар ID-Имя (для админа)
                    description: Список слотов зала
        '404':
          description: Зал не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sections/{gym-id}/admins:
    get:
      tags: [Sections]
      summary: Получить список администраторов зала
      operationId: getGymAdmins
      parameters:
        - name: gym-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID зала
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  admins:
                    type: array
                    items:
                      $ref: '#/components/schemas/Participant'
                    description: Список администраторов зала
        '404':
          description: Зал не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Sections]
      summary: Добавить администратора зала (админ)
      operationId: addGymAdmin
      parameters:
        - name: gym-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID зала
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  $ref: '#/components/schemas/UserId'
      responses:
        '204':
          description: Администратор успешно добавлен
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Зал или пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /slots:
    post:
      tags: [Slots]
      summary: Создать новый слот (админ)
      operationId: createSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startTime
                - endTime
                - gymId
                - capacity
              properties:
                startTime:
                  type: string
                  format: date-time
                  description: Время начала слота
                endTime:
                  type: string
                  format: date-time
                  description: Время окончания слота
                gymId:
                  type: string
                  format: uuid
                  description: ID зала
                capacity:
                  type: integer
                  minimum: 1
                  description: Вместимость слота
      responses:
        '200':
          description: Слот успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  slotId:
                    $ref: '#/components/schemas/SlotId'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Зал не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /slots/{slot-id}:
    get:
      tags: [Slots]
      summary: Получить информацию о слоте
      operationId: getSlotInfo
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  slotId:
                    $ref: '#/components/schemas/SlotId'
                  gymId:
                    type: string
                    format: uuid
                  gymName:
                    type: string
                  gymId:
                    type: string
                    format: uuid
                  gymName:
                    type: string
                  startTime:
                    type: string
                    format: date-time
                    description: Время начала
                  endTime:
                    type: string
                    format: date-time
                    description: Время окончания
                  capacity:
                    type: integer
                  participantsCount:
                  capacity:
                    type: integer
                  participantsCount:
                    type: integer
                    description: Количество записавшихся
                  participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Participant'
                    description: Детальный список записавшихся (для админа)
                    description: Количество записавшихся
                  participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Participant'
                    description: Детальный список записавшихся (для админа)
        '404':
          description: Слот не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Slots]
      summary: Закрыть слот для записи
      operationId: closeSlot
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
      responses:
        '204':
          description: Слот успешно закрыт
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Slots]
      summary: Изменить информацию о слоте (админ)
      operationId: updateSlotInfo
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                  description: Время начала
                endTime:
                  type: string
                  format: date-time
                  description: Время окончания
                capacity:
                  type: integer
      responses:
        '204':
          description: Информация успешно обновлена
        '403':
          description: Недостаточно прав или неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /slots/{slot-id}/entries:
    post:
      tags: [Slots]
      summary: Записаться в слот
      operationId: registerForSlot
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
          description: ID слота
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  $ref: '#/components/schemas/UserId'
      responses:
        '204':
          description: Успешная запись
        '404':
          description: Слот не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Slots]
      summary: Удалить запись пользователя
      operationId: deleteUserEntry
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
          description: ID слота
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  $ref: '#/components/schemas/UserId'
      responses:
        '204':
          description: Запись успешно удалена
        '403':
          description: Неверный токен или недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /queue/{slot-id}/join:
    post:
      tags: [Queue]
      summary: Встать в очередь на слот
      operationId: joinQueue
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
      responses:
        '204':
          description: Успешно добавлен в очередь

  /queue/{slot-id}/leave:
    post:
      tags: [Queue]
      summary: Выйти из очереди на слот
      operationId: leaveQueue
      parameters:
        - name: slot-id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SlotId'
      responses:
        '204':
          description: Успешно вышел из очереди

  /auth/createAccount:
    post:
      tags: [Auth]
      operationId: createAccount
      security: []
      requestBody:
        description: Данные для создания аккаунта
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Аккаунт успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    $ref: '#/components/schemas/UserId'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string

  /auth/login:
    post:
      tags: [Auth]
      summary: Login to account
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    $ref: '#/components/schemas/UserId'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '403':
          description: Неправильный пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Update tokens
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Токены успешно обновлены
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '403':
          description: Неверный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/account:
    delete:
      tags: [Auth]
      summary: Удалить аккаунт
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        '204':
          description: Аккаунт успешно удален
        '403':
          description: Неверный пароль или токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserId:
      type: string
      format: uuid
      description: "Уникальный идентификатор пользователя в формате UUID"
    SlotId:
      type: string
      format: uuid
      description: "Уникальный идентификатор слота"
    Participant:
      type: object
      required:
        - userId
        - userName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        userName:
          type: string
          description: "Имя пользователя"
    Participant:
      type: object
      required:
        - userId
        - userName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        userName:
          type: string
          description: "Имя пользователя"
    Error:
      type: object
      properties:
        error:
          type: string
          description: Сообщение об ошибке
        code:
          type: integer
          description: Код ошибки
      required:
        - error
        - code