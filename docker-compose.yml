services:
  db:
    image: postgres:15
    container_name: truten_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-truten_user}
      POSTGRES_PASSWORD: ${DB_PASS:-yourpassword}
      POSTGRES_DB: ${DB_NAME:-truten}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - truten_network

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: truten_server
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env
    networks:
      - truten_network

networks:
  truten_network:
    driver: bridge

volumes:
  postgres_data:
